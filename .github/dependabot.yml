version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - enhancement
    groups:
      web-dev:
        patterns:
          - "@types/*"
          - eslint*
          - typescript

  - package-ecosystem: pip
    directory: /services/math
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - enhancement
    ignore:
      # SymPy 1.14 ghim mpmath 1.3.0; bộ kiểm định và bộ nghiệm thu dùng đúng cặp này (PR #15 đã đóng)
      - dependency-name: mpmath

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - enhancement
