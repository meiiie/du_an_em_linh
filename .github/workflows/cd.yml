# CI xanh trên main → các hook riêng; kiểm đúng revision frontend và readiness core.
name: Triển khai
on:
  workflow_run:
    workflows: [Kiểm thử]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: trien-khai-main
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Gọi hook math, core, frontend
        env:
          MATH_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_MATH }}
          CORE_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_CORE }}
          FRONTEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          set -euo pipefail
          for hook in "$MATH_HOOK" "$CORE_HOOK" "$FRONTEND_HOOK"; do
            test -n "$hook" || { echo "Thiếu một trong ba deploy hook Render." >&2; exit 1; }
          done
          for hook in "$MATH_HOOK" "$CORE_HOOK" "$FRONTEND_HOOK"; do
            curl -fsS --max-time 60 -X POST "$hook" > /dev/null
          done
      - name: Đợi revision và readiness
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$FRONTEND_URL" || { echo "Thiếu biến FRONTEND_URL." >&2; exit 1; }
          URL="${FRONTEND_URL%/}"
          for i in $(seq 1 40); do
            body="$(curl -fsS --max-time 30 "$URL/version.json" || true)"
            got="$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("revision", ""))' 2>/dev/null || true)"
            if [ "$got" = "$SHA" ] && curl -fsS --max-time 30 "$URL/health" > /dev/null; then
              echo "Frontend đúng revision, core sẵn sàng."
              exit 0
            fi
            sleep 20
          done
          echo "Chưa xác nhận được revision và readiness." >&2
          exit 1
