# Push lên main: mọi job. PR: job «Phân loại thay đổi» chỉ bật job của vùng có file đổi (scripts/ci-thay-doi.mjs).
# Không cần khóa API — demo mặc định offline.
name: Kiểm thử

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: kiem-thu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  thay-doi:
    name: Phân loại thay đổi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      harness: ${{ steps.phan-loai.outputs.harness }}
      core: ${{ steps.phan-loai.outputs.core }}
      frontend: ${{ steps.phan-loai.outputs.frontend }}
      v0: ${{ steps.phan-loai.outputs.v0 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Khóa và số phiên bản (toàn repo, mọi PR)
        run: |
          node scripts/kiem-khoa.mjs
          node scripts/kiem-phien-ban.mjs
      - name: Test bộ phân loại
        run: node --test scripts/ci-thay-doi.test.mjs
      - name: Phân loại file đổi
        id: phan-loai
        # PR: so với nhánh gốc. Push lên main, chạy tay: không có base → chạy mọi job.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-thay-doi.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  harness:
    name: Harness — hook Claude Code
    needs: thay-doi
    if: needs.thay-doi.outputs.harness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test hook (.claude/hooks)
        run: node --test .claude/hooks/*.test.mjs

  core:
    name: Core — Maven + image
    needs: thay-doi
    if: needs.thay-doi.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hoc_toan
          POSTGRES_PASSWORD: hoc_toan
          POSTGRES_DB: hoc_toan_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hoc_toan -d hoc_toan_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/core/pom.xml
      - name: Build và test (ArchUnit, Testcontainers PostgreSQL 18)
        run: ./mvnw -B -ntp verify
      - name: Image chạy không root, health UP với CSDL thật
        run: |
          docker build -t hoc-toan-core:ci .
          test "$(docker run --rm --entrypoint id hoc-toan-core:ci -u)" = 1001
          docker run -d --name core --network host \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/hoc_toan_core \
            -e SPRING_DATASOURCE_USERNAME=hoc_toan \
            -e SPRING_DATASOURCE_PASSWORD=hoc_toan \
            hoc-toan-core:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "health UP sau $i lần thử"
              exit 0
            fi
            sleep 2
          done
          docker logs core
          exit 1

  toan:
    name: Dịch vụ toán
    needs: thay-doi
    if: needs.thay-doi.outputs.v0 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/math
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/math/pyproject.toml
      - name: Cài và pytest
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m pytest

  web:
    name: Web — typecheck lint unit
    needs: thay-doi
    if: needs.thay-doi.outputs.v0 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/kiem-phien-ban.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit

  frontend:
    name: Frontend — build + Vitest
    needs: thay-doi
    if: needs.thay-doi.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter frontend
      - run: pnpm --filter frontend build
      - run: pnpm --filter frontend test

  compose:
    name: Compose v2 — khói
    needs: thay-doi
    if: needs.thay-doi.outputs.core == 'true' || needs.thay-doi.outputs.frontend == 'true' || needs.thay-doi.outputs.v0 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Dựng cả hệ v2, chờ health từng dịch vụ
        run: docker compose -f compose.v2.yaml up --build --wait --wait-timeout 600
      - name: Khói qua nginx của frontend (→ core → PostgreSQL, math)
        run: bash scripts/khoi-v2.sh
      - name: Log khi lỗi
        if: failure()
        run: docker compose -f compose.v2.yaml logs --no-color

  e2e:
    name: Playwright e2e
    needs: thay-doi
    if: needs.thay-doi.outputs.v0 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hoc_toan
          POSTGRES_PASSWORD: hoc_toan
          POSTGRES_DB: hoc_toan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hoc_toan -d hoc_toan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://hoc_toan:hoc_toan@127.0.0.1:5432/hoc_toan
      PLAYWRIGHT_SHOTS: ${{ github.workspace }}/pw-shots
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/math/pyproject.toml
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Cài SymPy
        working-directory: services/math
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev]"
      - run: pnpm install --frozen-lockfile
      - name: Cache trình duyệt Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}
      - name: Cài Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Migrate và seed
        run: |
          pnpm db:migrate
          pnpm seed
      - name: E2E
        run: pnpm --filter web test:e2e
      - name: Ảnh khi thất bại
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-shots
          path: pw-shots
          if-no-files-found: ignore
