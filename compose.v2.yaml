# v2 cục bộ, một lệnh: docker compose -f compose.v2.yaml up --build --wait   → http://localhost:4200
# PostgreSQL 18 + services/core (profile dev: trường hư cấu THPT Nguyễn Trãi) + services/math + apps/frontend (nginx,
# /api/ → core). docker-compose.yml bao gồm tệp này. Chỉ dữ liệu tổng hợp (ADR 006).
# Mọi cổng chỉ mở trên 127.0.0.1; container không root, bỏ mọi capability, không leo quyền; log xoay vòng.
name: hoc-toan-v2

x-cung: &cung
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    <<: *cung
    image: postgres:18-alpine
    # Entrypoint của image đổi chủ thư mục dữ liệu rồi hạ quyền xuống user postgres: chỉ các quyền đó.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: hoc_toan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoc_toan}
      POSTGRES_DB: hoc_toan_core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoc_toan -d hoc_toan_core"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pgdata-v2:/var/lib/postgresql

  core:
    <<: *cung
    build:
      # Gốc repo: ảnh chứa data/supham, data/v0; data/dev chỉ gắn khi chạy demo.
      context: .
      dockerfile: services/core/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MATHL_DEV_SEED_PASSWORD: ${MATHL_DEV_SEED_PASSWORD:-}
      MATHL_DEV_SEED_PASSWORD_FILE: ${MATHL_DEV_SEED_PASSWORD_FILE:-/tmp/mathl-dev-seed-password}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hoc_toan_core
      SPRING_DATASOURCE_USERNAME: hoc_toan
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-hoc_toan}
      # Trống: core dùng khóa tạm, token mất hiệu lực mỗi lần khởi động lại (đủ cho chạy thử).
      APP_IDENTITY_JWT_SECRET: ${APP_IDENTITY_JWT_SECRET:-}
      APP_MATH_BASE_URL: http://math:8000
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_BASE_URL: ${GLM_BASE_URL:-}
      GLM_MODEL: ${GLM_MODEL:-}
      GLM_TIMEOUT: ${GLM_TIMEOUT:-45s}
      APP_CONTENT_IMPORT_ON_STARTUP: ${APP_CONTENT_IMPORT_ON_STARTUP:-true}
      MATHL_PUSH_INTERVAL: ${MATHL_PUSH_INTERVAL:-60000}
      GLM_FIRST_TOKEN_TIMEOUT: ${GLM_FIRST_TOKEN_TIMEOUT:-20s}
      GLM_MAX_TOKENS: ${GLM_MAX_TOKENS:-700}
      GIA_SU_TEMPERATURE: ${GIA_SU_TEMPERATURE:-0.8}
      GIA_SU_TOP_P: ${GIA_SU_TOP_P:-0.9}
      GIA_SU_TOKEN_BUDGET: ${GIA_SU_TOKEN_BUDGET:-6000}
      GLM_RATE_LIMIT_REQUESTS: ${GLM_RATE_LIMIT_REQUESTS:-12}
      GLM_RATE_LIMIT_WINDOW: ${GLM_RATE_LIMIT_WINDOW:-10m}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      CONTENT_AI_API_KEY: ${CONTENT_AI_API_KEY:-}
      CONTENT_AI_MODEL: ${CONTENT_AI_MODEL:-glm-5.3}
    depends_on:
      db:
        condition: service_healthy
      math:
        condition: service_healthy
    # Readiness, nhịp 5 giây để `up --wait` không phải chờ nhịp 30 giây của image.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      start_period: 90s
      retries: 6
    volumes:
      - ./data/dev:/app/noi-dung/dev:ro
    mem_limit: 1g
    ports:
      - "127.0.0.1:8080:8080"

  math:
    <<: *cung
    build:
      context: .
      dockerfile: services/math/Dockerfile
    environment:
      MATH_JOB_MEM_MB: ${MATH_JOB_MEM_MB:-512}
      MATH_JOB_CONCURRENCY: ${MATH_JOB_CONCURRENCY:-2}
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 6
    mem_limit: 1g
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    <<: *cung
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        GIT_SHA: ${BUILD_SHA:-development}
    environment:
      CORE_HOSTPORT: core:8080
      SITE_URL: ${SITE_URL:-http://localhost:4200}
    depends_on:
      core:
        condition: service_healthy
    mem_limit: 256m
    ports:
      - "127.0.0.1:4200:8080"

volumes:
  pgdata-v2:
