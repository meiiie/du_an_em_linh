spring:
  application:
    name: core
  threads:
    virtual:
      enabled: true # chờ I/O (dịch vụ toán, LLM) trên luồng ảo

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true # /actuator/health/liveness và /readiness cho Compose, staging
      show-details: never
