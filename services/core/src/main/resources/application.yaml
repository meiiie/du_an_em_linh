spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:hoc_toan_core}}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: core
  threads:
    virtual:
      enabled: true # chờ I/O (dịch vụ toán, LLM, CSDL) trên luồng ảo
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema do Flyway quản; lệch mapping thì không khởi động
  mvc:
    problemdetails:
      enabled: true # lỗi trả application/problem+json
  ai:
    # Starter OpenAI tự cấu hình 6 loại model, mặc định bật và đòi khóa lúc khởi động. Nhà AI của gia sư
    # dựng bằng mã cho từng nhà (research R3), nên tắt hết: core khởi động được khi không có khóa (chỉ `offline`).
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    retry:
      # Không gửi lại khi nhà lỗi (ADR 007). Spring AI 2.0 đưa giá trị này vào RetryPolicy.maxRetries của
      # Spring Framework 7: số lần gửi lại SAU lần đầu, nên 0 = gọi đúng một lần.
      max-attempts: 0

server:
  compression:
    enabled: false # SSE phải được flush theo từng delta, kể cả khi gọi core trực tiếp.
  shutdown: graceful
  # IP thật của client sau proxy (nginx của frontend, máy chủ triển khai): Tomcat RemoteIpValve chỉ tin X-Forwarded-For
  # từ proxy nội bộ (mặc định 10/8, 172.16/12, 192.168/16, 127/8…); khác thì đặt server.tomcat.remoteip.internal-proxies.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true # /actuator/health/liveness và /readiness cho Compose, staging
      show-details: never

# CSDL: SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD từ môi trường; profile dev có giá trị mặc định cục bộ.
app:
  math:
    base-url: ${APP_MATH_BASE_URL:http://${APP_MATH_HOSTPORT:localhost:8000}} # services/math; compose: http://math:8000
  identity:
    jwt-secret: ${APP_IDENTITY_JWT_SECRET:} # base64 >= 32 byte; trống → khóa tạm (chỉ hợp cho dev)
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    refresh-cookie-secure: true # cookie hta_refresh chỉ đi qua HTTPS (trình duyệt coi http://localhost là an toàn)
    login-failure-cleanup-cron: "0 27 3 * * *" # dọn lần đăng nhập sai quá một ngày (F-10)
  practice:
    nguong-doan-mo: 4 # một ô bị đổi từ chừng này lần thì nghi đoán mò (v0: nguong_doan_mo_so_lan_doi_o, data/v0/bkt.json)

mathl:
  gia-su:
    api-key: ${GLM_API_KEY:} # Trống hoặc chỉ khoảng trắng: chỉ model test/demo offline; lớp chọn GLM báo chưa sẵn sàng.
    base-url: ${GLM_BASE_URL:https://api.z.ai/api/coding/paas/v4}
    model: ${GLM_MODEL:glm-5.3}
    timeout: ${GLM_TIMEOUT:45s}
    first-token-timeout: ${GLM_FIRST_TOKEN_TIMEOUT:20s}
    max-tokens: ${GLM_MAX_TOKENS:700}
    temperature: ${GIA_SU_TEMPERATURE:0.8}
    top-p: ${GIA_SU_TOP_P:0.9}
    token-budget: ${GIA_SU_TOKEN_BUDGET:6000}
    rate-limit:
      requests: ${GLM_RATE_LIMIT_REQUESTS:12}
      window: ${GLM_RATE_LIMIT_WINDOW:10m}
