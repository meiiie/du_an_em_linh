- id: S17
  nhan: sai
  mo_ta: Hàng X ghi 2 rồi 0 (đảo thứ tự), đủ điểm; hàng dấu +,-,+ chép theo bảng đúng; kết luận đúng
  ma_loi_supham: ERR.DH.30
  ky_nang: T12.DH.03
  bai_lam:
    ham: x**3 - 3*x**2 + 2
    TXD: R
    dao_ham: 3*x**2 - 6*x
    y_phay_bang_0: ['0', '2']
    y_phay_khong_xd: []
    bang:
      moc: [-oo, '2', '0', oo]
      dau: [+, '-', +]
    ket_luan: &id003
      dong_bien: [(-oo; 0), (2; +oo)]
      nghich_bien: [(0; 2)]
      cuc_dai_x: ['0']
      cuc_tieu_x: ['2']
  buoc_sai_nhan: &id001
    ma_buoc: B.DH.XETDAU
    dong: null
    o: {hang: X, k: 1}
  loai_ket_qua_nhan: [SAI_THU_TU_MOC, DAU_DOI_TRONG_KHOANG]
  cac_van_de_nhan:
  - loai_ket_qua: SAI_THU_TU_MOC
    buoc_sai: *id001
    ma_loi: ERR.DH.30
    ky_nang: T12.DH.03
  - loai_ket_qua: DAU_DOI_TRONG_KHOANG
    buoc_sai:
      ma_buoc: B.DH.XETDAU
      dong: null
      o: {hang: DAU_YPHAY, k: 0}
    nguyen_nhan: SAI_THU_TU_MOC
  - loai_ket_qua: DAU_DOI_TRONG_KHOANG
    buoc_sai:
      ma_buoc: B.DH.XETDAU
      dong: null
      o: {hang: DAU_YPHAY, k: 4}
    nguyen_nhan: SAI_THU_TU_MOC
  tham_chieu_sympy:
    C: ['0', '2']
    diem_ngoai_D: []
    y_phay: 3*x*(x - 2)
