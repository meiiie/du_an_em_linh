# Bộ BỔ SUNG v1.3 cho bài làm 5 bước – mốc hàng X không tăng dần (loai_ket_qua SAI_THU_TU_MOC).
# Soạn 29/09/2026 theo chốt của No. KHÔNG thay đổi các ca đã đóng băng trong cac-ca-5-buoc.yaml (v1.2).
# Do Kiểm định SOẠN MÔ PHỎNG, không lấy từ log AI/học sinh thật.
# Bản sửa 29/09 ~11:10: nhãn S17, S18 ghi CẢ lỗi gốc lẫn ô hệ quả (cac_van_de_nhan); thêm S19–S25.
# Bản sửa 29/09 ~11:25 (chốt No 11:01): thêm S26–S29 (SAI_BIEN_DOI, mũi tên suy từ ô dấu sai, DIEM_THUA ERR.DH.24 / ERR.DH.31); `dong` trong nhãn đếm từ 0; mỗi vấn đề có ma_loi/ky_nang khi đã chốt.
# Bản sửa 29/09 ~11:30 (No 11:02): thêm S30 (mốc thừa, hai ô hai bên cùng dấu đúng -> chỉ DIEM_THUA) và S31 (SAI_TXD + DIEM_THIEU + SAI_THU_TU_MOC; API phải trả đủ mọi lỗi gốc theo thứ tự bước).
# NHÃN (buoc_sai_nhan, cac_van_de_nhan) TÍNH BẰNG SymPy bởi giai-doan-2/sinh_nhan_v13.py theo định nghĩa ở docstring
# của file đó (không dùng bộ kiểm của ta hay code repo). Tạo file: giai-doan-2/tao_bo_v13.py.
# QUY ƯỚC CHỈ SỐ = quy ước code (docs/chi-so-o-bang.md, commit 6eb8b06): k từ 0; hàng X chỉ đếm điểm theo thứ tự học
# sinh nhập; hàng DAU_YPHAY/BIEN_THIEN k chẵn = khoảng, k lẻ = điểm. KHÔNG cần quy đổi.
# `bang.moc` ghi đúng thứ tự học sinh nhập (app không tự sắp). `dau[j]` = ô khoảng thứ j theo cột học sinh.
# buoc_sai_nhan = vấn đề báo ĐẦU TIÊN trong cac_van_de_nhan (để adapter cũ vẫn chạy).
# Ô "chỉ sai vì vị trí" = sai so với khoảng học sinh dựng nhưng khớp đáp án cùng k sau khi sắp mốc tăng dần
#   -> loại theo kết quả kiểm + nguyen_nhan: SAI_THU_TU_MOC, không trừ điểm lần hai. Ô vẫn sai sau khi sắp: lỗi riêng.
# Ô khoảng mà y' đổi dấu bên trong khoảng học sinh dựng ghi DAU_DOI_TRONG_KHOANG; y' không đổi dấu nhưng ô khác dấu ghi SAI_DAU.
# Mã lỗi theo supham/ma-loi-DH.csv bản 29/09 11:00 (31 mã): ERR.DH.30 = SAI_THU_TU_MOC, ERR.DH.24/ERR.DH.31 = DIEM_THUA.
