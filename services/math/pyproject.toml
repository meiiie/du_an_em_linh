[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "hoc-toan-math"
version = "0.1.0"  # x-release-please-version
description = "Dịch vụ toán: chấm khung 5 bước, kiểm định 3 tầng, bộ lọc lộ đáp án"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sympy==1.14.0",
  "mpmath==1.4.1",
  "pyyaml>=6",
  "pypdf>=5",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.fastapi]
entrypoint = "app.main:app"
