# Blueprint Angular + core + math; chưa thực hiện triển khai.
# Dịch vụ riêng cần gói trả phí; cấu hình này chỉ là bản chuẩn bị.
# Nguồn: https://render.com/docs/blueprint-spec (2026-10-13).
services:
  - type: web
    name: hoc-toan-frontend
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./apps/frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: CORE_HOSTPORT
        fromService:
          type: pserv
          name: hoc-toan-core
          property: hostport
      - key: SITE_URL
        fromService:
          type: web
          name: hoc-toan-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: pserv
    name: hoc-toan-core
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./services/core/Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    envVars:
      - key: SERVER_PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PGHOST
        fromDatabase:
          name: hoc-toan-pg
          property: host
      - key: PGPORT
        fromDatabase:
          name: hoc-toan-pg
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: hoc-toan-pg
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: hoc-toan-pg
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: hoc-toan-pg
          property: password
      - key: APP_MATH_HOSTPORT
        fromService:
          type: pserv
          name: hoc-toan-math
          property: hostport
      - key: APP_IDENTITY_JWT_SECRET
        # Cấp base64 của ít nhất 32 byte; không giả định chuỗi Render sinh có định dạng base64.
        sync: false

  - type: pserv
    name: hoc-toan-math
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./services/math/Dockerfile
    dockerContext: .
    autoDeployTrigger: off

databases:
  - name: hoc-toan-pg
    plan: basic-256mb
    region: singapore
    databaseName: hoc_toan_core
    user: hoc_toan
    ipAllowList: []
